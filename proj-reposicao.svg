<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img"><title>Projeto-chave</title><style>
text{font-family:Consolas, 'Courier New', Menlo, monospace}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(var(--h))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.6s ease-out both}
.fade{animation:fade .8s ease-out both}
</style>
<rect width="800" height="340" fill="#04070c"/>
<rect x="6" y="5" width="9" height="9" fill="#ffb627" transform="rotate(45 10.5 9.5)"/>
<text x="26" y="15" fill="#2fd8ff" font-size="14" font-weight="bold" letter-spacing="1.5">PROJETO-CHAVE</text>
<rect x="172.6" y="7" width="507.0" height="2" fill="#2fd8ff"/><rect x="172.6" y="12" width="304.2" height="1" fill="#0f4a5c"/>
<rect x="687.6" y="2" width="104.4" height="18" fill="none" stroke="#ffb627" stroke-width="1"/><text x="739.8" y="15" fill="#ffb627" font-size="11" text-anchor="middle">PROTOCOLO 03</text>
<rect x="10" y="36" width="780" height="294" fill="#071019" stroke="#0f4a5c" stroke-width="1"/>
<path d="M4 48V30H22" stroke="#2fd8ff" stroke-width="3" fill="none"/><path d="M796 48V30H778" stroke="#2fd8ff" stroke-width="3" fill="none"/><path d="M4 318V336H22" stroke="#2fd8ff" stroke-width="3" fill="none"/><path d="M796 318V336H778" stroke="#2fd8ff" stroke-width="3" fill="none"/>
<text x="30" y="62" fill="#ffb627" font-size="11" letter-spacing="2">PROTOCOLO 03</text><rect x="716.0" y="49" width="54.0" height="18" fill="none" stroke="#3dffa8"/><text x="743.0" y="62" fill="#3dffa8" font-size="11" text-anchor="middle">ATIVO</text><text x="30" y="88.0" fill="#d9f6ff" font-size="20" text-anchor="start" font-weight="bold">Planejamento de Reposição de Estoque</text><text x="30" y="118" fill="#2fd8ff" font-size="11" letter-spacing="1.5">OBJETIVO</text><text x="30" y="136.0" fill="#d9f6ff" font-size="13" text-anchor="start" font-weight="normal">Calcular quando e quanto comprar, considerando prazo de entrega e restrições do fornecedor.</text><text x="32" y="163" fill="#2fd8ff" font-size="13">▸</text><text x="52" y="163.0" fill="#b9d9e6" font-size="13" text-anchor="start" font-weight="normal">Separei regras de negócio, interface e persistência para facilitar manutenção e evolução.</text><text x="32" y="188" fill="#2fd8ff" font-size="13">▸</text><text x="52" y="188.0" fill="#b9d9e6" font-size="13" text-anchor="start" font-weight="normal">Ajuste à compra mínima e ao múltiplo do fornecedor, com registro das decisões de aceitar,</text><text x="52" y="207.0" fill="#b9d9e6" font-size="13" text-anchor="start" font-weight="normal">ajustar ou adiar.</text><text x="32" y="232" fill="#2fd8ff" font-size="13">▸</text><text x="52" y="232.0" fill="#b9d9e6" font-size="13" text-anchor="start" font-weight="normal">Interface desktop e opção por terminal, com testes e sem dependências externas à</text><text x="52" y="251.0" fill="#b9d9e6" font-size="13" text-anchor="start" font-weight="normal">biblioteca padrão do Python.</text><line x1="30" y1="270" x2="770" y2="270" stroke="#0f4a5c" stroke-dasharray="4 4"/><text x="30" y="286" fill="#ffb627" font-size="11" letter-spacing="1.5">STACK</text><text x="30" y="304.0" fill="#6f93a3" font-size="12" text-anchor="start" font-weight="normal">Python · Tkinter · JSON · CSV · unittest</text>
</svg>