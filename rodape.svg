<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="800" height="150" role="img"><title>Aberto a oportunidades</title><style>
text{font-family:Consolas, 'Courier New', Menlo, monospace}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(var(--h))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.6s ease-out both}
.fade{animation:fade .8s ease-out both}
</style><rect width="800" height="150" fill="#04070c"/>
<rect x="2" y="2" width="796" height="146" fill="none" stroke="#2fd8ff" stroke-width="2"/>
<text x="400.0" y="48" fill="#6f93a3" font-size="12" text-anchor="middle" letter-spacing="2">ASSISTENTE &gt; NOVA OPORTUNIDADE DETECTADA</text>
<text x="400.0" y="86" fill="#d9f6ff" font-size="22" font-weight="bold" text-anchor="middle">Aberto a oportunidades em</text>
<text x="400.0" y="114" fill="#2fd8ff" font-size="22" font-weight="bold" text-anchor="middle">back-end, automação e IA<tspan fill="#ffb627" class="blink">_</tspan></text>
<rect x="250.0" y="128" width="300" height="2" fill="#ffb627" class="grow"/></svg>