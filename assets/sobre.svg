<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 178" width="800" height="178" role="img"><title>Arquivo do operador</title><style>
text{font-family:Consolas, 'Courier New', Menlo, monospace}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(var(--h))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.6s ease-out both}
.fade{animation:fade .8s ease-out both}
</style>
<rect width="800" height="178" fill="#04070c"/>
<rect x="6" y="5" width="9" height="9" fill="#ffb627" transform="rotate(45 10.5 9.5)"/>
<text x="26" y="15" fill="#2fd8ff" font-size="14" font-weight="bold" letter-spacing="1.5">ARQUIVO DO OPERADOR</text>
<rect x="233.79999999999998" y="7" width="424.20000000000005" height="2" fill="#2fd8ff"/><rect x="233.79999999999998" y="12" width="254.52" height="1" fill="#0f4a5c"/>
<rect x="666.0" y="2" width="126.0" height="18" fill="none" stroke="#ffb627" stroke-width="1"/><text x="729.0" y="15" fill="#ffb627" font-size="11" text-anchor="middle">ACESSO LIBERADO</text>
<rect x="10" y="36" width="780" height="132" fill="#071019" stroke="#0f4a5c" stroke-width="1"/>
<path d="M4 48V30H22" stroke="#2fd8ff" stroke-width="3" fill="none"/><path d="M796 48V30H778" stroke="#2fd8ff" stroke-width="3" fill="none"/><path d="M4 156V174H22" stroke="#2fd8ff" stroke-width="3" fill="none"/><path d="M796 156V174H778" stroke="#2fd8ff" stroke-width="3" fill="none"/>
<text x="30" y="66" fill="#ffb627" font-size="12">ASSISTENTE &gt;</text><text x="130" y="66" fill="#6f93a3" font-size="12">"Senhor, aqui está o resumo do operador."</text><rect x="30" y="80" width="3" height="66" fill="#2fd8ff"/><text x="50" y="92.0" fill="#d9f6ff" font-size="14" text-anchor="start" font-weight="normal">Desenvolvo sistemas para apoiar decisões de estoque, organizar dados e automatizar</text><text x="50" y="114.0" fill="#d9f6ff" font-size="14" text-anchor="start" font-weight="normal">operações. Conduzo projetos da definição do problema à implementação, com testes e</text><text x="50" y="136.0" fill="#d9f6ff" font-size="14" text-anchor="start" font-weight="normal">documentação das decisões técnicas.</text>
</svg>