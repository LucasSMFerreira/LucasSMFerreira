<text x="26" y="15" fill="#2fd8ff" font-size="14" font-weight="bold" letter-spacing="1.5">DIAGNÓSTICO DO SISTEMA</text>
<rect x="264.4" y="7" width="400.80000000000007" height="2" fill="#2fd8ff"/><rect x="264.4" y="12" width="240.48000000000002" height="1" fill="#0f4a5c"/>
<rect x="673.2" y="2" width="118.8" height="18" fill="none" stroke="#ffb627" stroke-width="1"/><text x="732.6" y="15" fill="#ffb627" font-size="11" text-anchor="middle">CONCLUSÃO 2028</text>
