<text x="30" y="62" fill="#6f93a3" font-size="10" letter-spacing="1.5">CLASSE</text><text x="30" y="80" fill="#d9f6ff" font-size="14">Desenvolvedor Back-end</text><text x="410" y="62" fill="#6f93a3" font-size="10" letter-spacing="1.5">ESPECIALIDADE</text><text x="410" y="80" fill="#d9f6ff" font-size="14">APIs, automação e IA aplicada</text><text x="30" y="108" fill="#6f93a3" font-size="10" letter-spacing="1.5">BASE</text><text x="30" y="126" fill="#d9f6ff" font-size="14">Armação dos Búzios, RJ</text><text x="410" y="108" fill="#6f93a3" font-size="10" letter-spacing="1.5">FORMAÇÃO</text><text x="410" y="126" fill="#d9f6ff" font-size="14">Eng. de Software — Univ. de Vassouras</text><text x="30" y="154" fill="#6f93a3" font-size="10" letter-spacing="1.5">MÓDULO ATUAL</text><text x="30" y="172" fill="#d9f6ff" font-size="14">5º período</text><text x="410" y="154" fill="#6f93a3" font-size="10" letter-spacing="1.5">MISSÃO</text><text x="410" y="172" fill="#d9f6ff" font-size="14">Vaga em back-end, automação ou IA</text><text x="30" y="208" fill="#2fd8ff" font-size="11" letter-spacing="1">INTEGRIDADE DO CURSO</text><text x="770" y="208" fill="#2fd8ff" font-size="11" text-anchor="end">5 / 10 PERÍODOS</text><rect x="30" y="216" width="68" height="10" fill="#2fd8ff"/><rect x="104" y="216" width="68" height="10" fill="#2fd8ff"/><rect x="178" y="216" width="68" height="10" fill="#2fd8ff"/><rect x="252" y="216" width="68" height="10" fill="#2fd8ff"/><rect x="326" y="216" width="68" height="10" fill="#2fd8ff" class="pulse"/><rect x="400" y="216" width="68" height="10" fill="#0b2a35"/><rect x="474" y="216" width="68" height="10" fill="#0b2a35"/><rect x="548" y="216" width="68" height="10" fill="#0b2a35"/><rect x="622" y="216" width="68" height="10" fill="#0b2a35"/><rect x="696" y="216" width="68" height="10" fill="#0b2a35"/>
