<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" width="800" height="396" role="img"><title>Projeto-chave</title><style>
text{font-family:Consolas, 'Courier New', Menlo, monospace}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(var(--h))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.6s ease-out both}
.fade{animation:fade .8s ease-out both}
</style>
<rect width="800" height="396" fill="#04070c"/>
<rect x="6" y="5" width="9" height="9" fill="#ffb627" transform="rotate(45 10.5 9.5)"/>
<text x="26" y="15" fill="#2fd8ff" font-size="14" font-weight="bold" letter-spacing="1.5">PROJETO-CHAVE</text>
<rect x="172.6" y="7" width="507.0" height="2" fill="#2fd8ff"/><rect x="172.6" y="12" width="304.2" height="1" fill="#0f4a5c"/>
<rect x="687.6" y="2" width="104.4" height="18" fill="none" stroke="#ffb627" stroke-width="1"/><text x="739.8" y="15" fill="#ffb627" font-size="11" text-anchor="middle">PROTOCOLO 02</text>
<rect x="10" y="36" width="780" height="350" fill="#071019" stroke="#0f4a5c" stroke-width="1"/>
<path d="M4 48V30H22" stroke="#2fd8ff" stroke-width="3" fill="none"/><path d="M796 48V30H778" stroke="#2fd8ff" stroke-width="3" fill="none"/><path d="M4 374V392H22" stroke="#2fd8ff" stroke-width="3" fill="none"/><path d="M796 374V392H778" stroke="#2fd8ff" stroke-width="3" fill="none"/>
<text x="30" y="62" fill="#ffb627" font-size="11" letter-spacing="2">PROTOCOLO 02</text><rect x="723.2" y="49" width="46.8" height="18" fill="none" stroke="#3dffa8"/><text x="746.6" y="62" fill="#3dffa8" font-size="11" text-anchor="middle">v1.0</text><text x="30" y="88.0" fill="#d9f6ff" font-size="20" text-anchor="start" font-weight="bold">Previsão de Demanda e Planejamento de Estoque</text><text x="30" y="118" fill="#2fd8ff" font-size="11" letter-spacing="1.5">OBJETIVO</text><text x="30" y="136.0" fill="#d9f6ff" font-size="13" text-anchor="start" font-weight="normal">Transformar registros de vendas em estimativas de demanda e apoio à reposição.</text><text x="32" y="163" fill="#2fd8ff" font-size="13">▸</text><text x="52" y="163.0" fill="#b9d9e6" font-size="13" text-anchor="start" font-weight="normal">Aplicação multiusuário para registrar vendas, comparar previsões e estimar reposição, com</text><text x="52" y="182.0" fill="#b9d9e6" font-size="13" text-anchor="start" font-weight="normal">dados separados por conta.</text><text x="32" y="207" fill="#2fd8ff" font-size="13">▸</text><text x="52" y="207.0" fill="#b9d9e6" font-size="13" text-anchor="start" font-weight="normal">Comparei referência semanal, Random Forest e XGBoost em avaliação temporal; o Random</text><text x="52" y="226.0" fill="#b9d9e6" font-size="13" text-anchor="start" font-weight="normal">Forest reduziu o MAE em aproximadamente 83% no cenário sintético. O resultado não</text><text x="52" y="245.0" fill="#b9d9e6" font-size="13" text-anchor="start" font-weight="normal">representa precisão validada em vendas reais.</text><text x="32" y="270" fill="#2fd8ff" font-size="13">▸</text><text x="52" y="270.0" fill="#b9d9e6" font-size="13" text-anchor="start" font-weight="normal">Testes automatizados, CI com banco descartável e documentação de atualização para a</text><text x="52" y="289.0" fill="#b9d9e6" font-size="13" text-anchor="start" font-weight="normal">versão 1.0.</text><line x1="30" y1="308" x2="770" y2="308" stroke="#0f4a5c" stroke-dasharray="4 4"/><text x="30" y="324" fill="#ffb627" font-size="11" letter-spacing="1.5">STACK</text><text x="30" y="342.0" fill="#6f93a3" font-size="12" text-anchor="start" font-weight="normal">Python · scikit-learn · XGBoost · SQLAlchemy · PostgreSQL/TimescaleDB · Streamlit · Docker · pytest ·</text><text x="30" y="360.0" fill="#6f93a3" font-size="12" text-anchor="start" font-weight="normal">GitHub Actions</text>
</svg>