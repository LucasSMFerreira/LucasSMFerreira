<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 481" width="800" height="481" role="img"><title>Projeto-chave</title><style>
text{font-family:Consolas, 'Courier New', Menlo, monospace}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(var(--h))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.6s ease-out both}
.fade{animation:fade .8s ease-out both}
</style>
<rect width="800" height="481" fill="#04070c"/>
<rect x="6" y="5" width="9" height="9" fill="#ffb627" transform="rotate(45 10.5 9.5)"/>
<text x="26" y="15" fill="#2fd8ff" font-size="14" font-weight="bold" letter-spacing="1.5">PROJETO-CHAVE</text>
<rect x="172.6" y="7" width="507.0" height="2" fill="#2fd8ff"/><rect x="172.6" y="12" width="304.2" height="1" fill="#0f4a5c"/>
<rect x="687.6" y="2" width="104.4" height="18" fill="none" stroke="#ffb627" stroke-width="1"/><text x="739.8" y="15" fill="#ffb627" font-size="11" text-anchor="middle">PROTOCOLO 01</text>
<rect x="10" y="36" width="780" height="435" fill="#071019" stroke="#0f4a5c" stroke-width="1"/>
<path d="M4 48V30H22" stroke="#2fd8ff" stroke-width="3" fill="none"/><path d="M796 48V30H778" stroke="#2fd8ff" stroke-width="3" fill="none"/><path d="M4 459V477H22" stroke="#2fd8ff" stroke-width="3" fill="none"/><path d="M796 459V477H778" stroke="#2fd8ff" stroke-width="3" fill="none"/>
<text x="30" y="62" fill="#ffb627" font-size="11" letter-spacing="2">PROTOCOLO 01</text><rect x="716.0" y="49" width="54.0" height="18" fill="none" stroke="#3dffa8"/><text x="743.0" y="62" fill="#3dffa8" font-size="11" text-anchor="middle">ATIVO</text><text x="30" y="88.0" fill="#d9f6ff" font-size="20" text-anchor="start" font-weight="bold">Assistente de Estudos com IA</text><text x="30" y="118" fill="#2fd8ff" font-size="11" letter-spacing="1.5">OBJETIVO</text><text x="30" y="136.0" fill="#d9f6ff" font-size="13" text-anchor="start" font-weight="normal">Consultar PDFs de aula por perguntas em linguagem natural, com indicação do documento e da</text><text x="30" y="155.0" fill="#d9f6ff" font-size="13" text-anchor="start" font-weight="normal">página.</text><text x="32" y="182" fill="#2fd8ff" font-size="13">▸</text><text x="52" y="182.0" fill="#b9d9e6" font-size="13" text-anchor="start" font-weight="normal">Fluxo RAG com ingestão de PDFs, embeddings e busca vetorial no PostgreSQL com pgvector,</text><text x="52" y="201.0" fill="#b9d9e6" font-size="13" text-anchor="start" font-weight="normal">integrado a modelos locais pelo Ollama.</text><text x="32" y="226" fill="#2fd8ff" font-size="13">▸</text><text x="52" y="226.0" fill="#b9d9e6" font-size="13" text-anchor="start" font-weight="normal">Comparei quatro configurações de divisão de texto em 15 perguntas: baseline com Acerto@4</text><text x="52" y="245.0" fill="#b9d9e6" font-size="13" text-anchor="start" font-weight="normal">de 73,3% e MRR de 0,70. A avaliação é pequena e mede a recuperação das fontes, não a</text><text x="52" y="264.0" fill="#b9d9e6" font-size="13" text-anchor="start" font-weight="normal">precisão final das respostas.</text><text x="32" y="289" fill="#2fd8ff" font-size="13">▸</text><text x="52" y="289.0" fill="#b9d9e6" font-size="13" text-anchor="start" font-weight="normal">CI com Ruff e pytest e deploy automatizado em servidor Ubuntu próprio, com Docker e</text><text x="52" y="308.0" fill="#b9d9e6" font-size="13" text-anchor="start" font-weight="normal">runner self-hosted.</text><line x1="30" y1="327" x2="770" y2="327" stroke="#0f4a5c" stroke-dasharray="4 4"/><text x="30" y="343" fill="#ffb627" font-size="11" letter-spacing="1.5">STACK</text><text x="30" y="361.0" fill="#6f93a3" font-size="12" text-anchor="start" font-weight="normal">Python · FastAPI · Pydantic · Uvicorn · PostgreSQL · pgvector · SQLAlchemy · Ollama · Docker Compose ·</text><text x="30" y="379.0" fill="#6f93a3" font-size="12" text-anchor="start" font-weight="normal">pytest · Ruff · GitHub Actions · Ubuntu Server · Tailscale</text><rect x="30" y="399" width="740" height="58" fill="#1d1206" stroke="#ffb627" stroke-opacity=".5"/><text x="44" y="415" fill="#ffb627" font-size="10" letter-spacing="1.5">⚠ LIMITE ATUAL</text><text x="44" y="433.0" fill="#ffd98a" font-size="12" text-anchor="start" font-weight="normal">Respostas levam de 1 a 3 minutos no hardware local sem GPU, conforme a documentação do</text><text x="44" y="451.0" fill="#ffd98a" font-size="12" text-anchor="start" font-weight="normal">projeto.</text>
</svg>