<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 346" width="800" height="346" role="img"><title>Liderança e iniciativa</title><style>
text{font-family:Consolas, 'Courier New', Menlo, monospace}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(var(--h))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.6s ease-out both}
.fade{animation:fade .8s ease-out both}
</style>
<rect width="800" height="346" fill="#04070c"/>
<rect x="6" y="5" width="9" height="9" fill="#ffb627" transform="rotate(45 10.5 9.5)"/>
<text x="26" y="15" fill="#2fd8ff" font-size="14" font-weight="bold" letter-spacing="1.5">LIDERANÇA E INICIATIVA</text>
<rect x="264.4" y="7" width="531.6" height="2" fill="#2fd8ff"/><rect x="264.4" y="12" width="318.96" height="1" fill="#0f4a5c"/>

<rect x="10" y="36" width="780" height="300" fill="#071019" stroke="#0f4a5c" stroke-width="1"/>
<path d="M4 48V30H22" stroke="#2fd8ff" stroke-width="3" fill="none"/><path d="M796 48V30H778" stroke="#2fd8ff" stroke-width="3" fill="none"/><path d="M4 324V342H22" stroke="#2fd8ff" stroke-width="3" fill="none"/><path d="M796 324V342H778" stroke="#2fd8ff" stroke-width="3" fill="none"/>
<rect x="30" y="50" width="22" height="22" fill="none" stroke="#ffb627"/><text x="41" y="66" fill="#ffb627" font-size="11" text-anchor="middle">1</text><text x="66" y="65" fill="#d9f6ff" font-size="14" font-weight="bold">Fundador da SmartShop</text><text x="66" y="85.0" fill="#b9d9e6" font-size="12" text-anchor="start" font-weight="normal">Defini proposta de produto, modelo de assinatura e preços para uma comunidade e loja de</text><text x="66" y="103.0" fill="#b9d9e6" font-size="12" text-anchor="start" font-weight="normal">ferramentas digitais.</text><rect x="30" y="125" width="22" height="22" fill="none" stroke="#ffb627"/><text x="41" y="141" fill="#ffb627" font-size="11" text-anchor="middle">2</text><text x="66" y="140" fill="#d9f6ff" font-size="14" font-weight="bold">Criador do Orquestra</text><text x="66" y="160.0" fill="#b9d9e6" font-size="12" text-anchor="start" font-weight="normal">Conduzo concepção, desenvolvimento, distribuição e suporte de uma ferramenta de geração de</text><text x="66" y="178.0" fill="#b9d9e6" font-size="12" text-anchor="start" font-weight="normal">sites em volume com IA.</text><rect x="30" y="200" width="22" height="22" fill="none" stroke="#ffb627"/><text x="41" y="216" fill="#ffb627" font-size="11" text-anchor="middle">3</text><text x="66" y="215" fill="#d9f6ff" font-size="14" font-weight="bold">Automação de operações</text><text x="66" y="235.0" fill="#b9d9e6" font-size="12" text-anchor="start" font-weight="normal">Implementei bots em nuvem para automatizar venda e entrega, dispensando intervenção manual por</text><text x="66" y="253.0" fill="#b9d9e6" font-size="12" text-anchor="start" font-weight="normal">pedido.</text><rect x="30" y="275" width="22" height="22" fill="none" stroke="#ffb627"/><text x="41" y="291" fill="#ffb627" font-size="11" text-anchor="middle">4</text><text x="66" y="290" fill="#d9f6ff" font-size="14" font-weight="bold">Organização de entregas</text><text x="66" y="310.0" fill="#b9d9e6" font-size="12" text-anchor="start" font-weight="normal">Formação certificada em Scrum, com foco em priorização e evolução incremental.</text>
</svg>