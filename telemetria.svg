<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img"><title>Telemetria — resultados em destaque</title><style>
text{font-family:Consolas, 'Courier New', Menlo, monospace}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(var(--h))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.6s ease-out both}
.fade{animation:fade .8s ease-out both}
</style>
<rect width="800" height="380" fill="#04070c"/>
<rect x="6" y="5" width="9" height="9" fill="#ffb627" transform="rotate(45 10.5 9.5)"/>
<text x="26" y="15" fill="#2fd8ff" font-size="14" font-weight="bold" letter-spacing="1.5">TELEMETRIA — RESULTADOS EM DESTAQUE</text>
<rect x="397.0" y="7" width="399.0" height="2" fill="#2fd8ff"/><rect x="397.0" y="12" width="239.39999999999998" height="1" fill="#0f4a5c"/>

<rect x="10" y="36" width="780" height="334" fill="#071019" stroke="#0f4a5c" stroke-width="1"/>
<path d="M4 48V30H22" stroke="#2fd8ff" stroke-width="3" fill="none"/><path d="M796 48V30H778" stroke="#2fd8ff" stroke-width="3" fill="none"/><path d="M4 358V376H22" stroke="#2fd8ff" stroke-width="3" fill="none"/><path d="M796 358V376H778" stroke="#2fd8ff" stroke-width="3" fill="none"/>
<rect x="24" y="50" width="371" height="150" fill="#08161f" stroke="#0f4a5c"/><rect x="24" y="50" width="4" height="150" fill="#ffb627"/><text x="42" y="92" fill="#ffb627" font-size="32" font-weight="bold">-83%</text><text x="42" y="112" fill="#6f93a3" font-size="10" letter-spacing="1.5">ERRO DE PREVISÃO</text><text x="42" y="134.0" fill="#d9f6ff" font-size="12" text-anchor="start" font-weight="normal">Random Forest: MAE 0,533 un./dia contra 3,095</text><text x="42" y="151.0" fill="#d9f6ff" font-size="12" text-anchor="start" font-weight="normal">da referência semanal, em 3 janelas temporais</text><text x="42" y="168.0" fill="#d9f6ff" font-size="12" text-anchor="start" font-weight="normal">(benchmark sintético).</text><rect x="405" y="50" width="371" height="150" fill="#08161f" stroke="#0f4a5c"/><rect x="405" y="50" width="4" height="150" fill="#2fd8ff"/><text x="423" y="92" fill="#2fd8ff" font-size="32" font-weight="bold">04</text><text x="423" y="112" fill="#6f93a3" font-size="10" letter-spacing="1.5">PROJETOS PÚBLICOS</text><text x="423" y="134.0" fill="#d9f6ff" font-size="12" text-anchor="start" font-weight="normal">Back-end, automação e IA: assistente RAG com</text><text x="423" y="151.0" fill="#d9f6ff" font-size="12" text-anchor="start" font-weight="normal">modelos locais, aplicações de estoque e uma</text><text x="423" y="168.0" fill="#d9f6ff" font-size="12" text-anchor="start" font-weight="normal">API Java.</text><rect x="24" y="210" width="371" height="150" fill="#08161f" stroke="#0f4a5c"/><rect x="24" y="210" width="4" height="150" fill="#2fd8ff"/><text x="42" y="252" fill="#2fd8ff" font-size="32" font-weight="bold">SEG</text><text x="42" y="272" fill="#6f93a3" font-size="10" letter-spacing="1.5">SEGURANÇA</text><text x="42" y="294.0" fill="#d9f6ff" font-size="12" text-anchor="start" font-weight="normal">scrypt com salt individual, bloqueio após</text><text x="42" y="311.0" fill="#d9f6ff" font-size="12" text-anchor="start" font-weight="normal">cinco tentativas e expiração de sessão por</text><text x="42" y="328.0" fill="#d9f6ff" font-size="12" text-anchor="start" font-weight="normal">inatividade.</text><rect x="405" y="210" width="371" height="150" fill="#08161f" stroke="#0f4a5c"/><rect x="405" y="210" width="4" height="150" fill="#2fd8ff"/><text x="423" y="252" fill="#2fd8ff" font-size="32" font-weight="bold">CI</text><text x="423" y="272" fill="#6f93a3" font-size="10" letter-spacing="1.5">BANCO REAL NO CI</text><text x="423" y="294.0" fill="#d9f6ff" font-size="12" text-anchor="start" font-weight="normal">Inicialização, isolamento de contas e</text><text x="423" y="311.0" fill="#d9f6ff" font-size="12" text-anchor="start" font-weight="normal">importação idempotente em</text><text x="423" y="328.0" fill="#d9f6ff" font-size="12" text-anchor="start" font-weight="normal">PostgreSQL/TimescaleDB descartável no GitHub</text><text x="423" y="345.0" fill="#d9f6ff" font-size="12" text-anchor="start" font-weight="normal">Actions.</text>
</svg>